<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapStop</title>
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            position: relative; 
            min-height: 100vh;
        }

        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(244, 244, 249, 0.98);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-sizing: border-box;
        }
        .auth-box h2 { margin-top: 0; color: #333; font-size: 22px; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-auth {
            background-color: #007bff;
            color: white; border: none; padding: 12px;
            width: 100%; border-radius: 4px; font-weight: bold;
            cursor: pointer; margin-top: 10px; font-size: 15px;
        }
        .btn-auth:hover { background-color: #0056b3; }
        .auth-toggle { margin-top: 15px; font-size: 13px; color: #666; cursor: pointer; }
        .auth-toggle span { color: #007bff; text-decoration: underline; font-weight: bold; }

        .logo-angolo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-angolo img {
            max-width: 200px;
            height: auto;
            display: block;
        }

        .popup-content {
            padding: 5px;
            min-width: 150px;
            text-align: center;
        }

        .nome-fermata {
            font-weight: bold;
            font-size: 15px;
            color: #333;
            margin: 0;
            display: block;
        }

        .btn-prenota {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: block;
            margin: 10px 0 0 0;
            width: 100%;
        }
        .btn-prenota:hover {
            background-color: #218838;
        }


        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: white;
            width: 90%;
            max-width: 400px; 
            height: auto;       
            max-height: 90vh;   
            overflow-y: auto;   
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column; 
            gap: 15px;
            padding: 35px 25px 25px 25px;
            box-sizing: border-box;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }

        .modal-section {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #495057;
            transition: all 0.3s ease;
        }

        .modal-section h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .modal-section.disabled {
            opacity: 0.3;
            pointer-events: none;
            background-color: #e9ecef;
            border-color: #ced4da;
        }

        .modal-section select {
            padding: 10px;
            font-size: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%; 
            box-sizing: border-box;
        }

        .section-conferma {
            background-color: #fff;
            border: none;
            padding: 5px 0 0 0;
        }

        .btn-conferma {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-conferma:hover {
            background-color: #bd2130;
        }

        .btn-conferma:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .widget-viaggio {
            position: fixed;
            top: 40px;
            right: 20px;
            width: 280px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-left: 5px solid #dc3545;
            padding: 15px;
            z-index: 999;
            box-sizing: border-box;
            display: none;
            transition: all 0.3s ease;
        }

        .widget-viaggio.active {
            display: block;
        }

        .widget-viaggio h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .widget-close {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 18px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
        }
        .widget-close:hover {
            color: #333;
        }

        .widget-info {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }

        .widget-info strong {
            color: #111;
        }
    </style>
</head>
<body>

    <div class="auth-overlay" id="authScreen">
        <div class="auth-box">
            <h2 id="authTitle">Accedi a NapStop</h2>
            <input type="email" id="authEmail" placeholder="Email" required>
            <input type="password" id="authPassword" placeholder="Password" required>
            <button class="btn-auth" id="btnAuthSubmit" onclick="gestisciAutenticazione()">Accedi</button>
            <div class="auth-toggle" id="authToggle" onclick="cambiaModalitaAuth()">
                Non hai un account? <span>Registrati qui</span>
            </div>
        </div>
    </div>

    <h1>NapStop, implementazione visuale mappa con api google</h1>
    
    <div id="map">Caricamento mappa in corso...</div>

    <div class="logo-angolo">
        <img src="logo_napstop.png" alt="Logo NapStop">
    </div>

    <div class="modal-overlay" id="modalConfigurazione">
        <div class="modal-box">
            <button class="modal-close" onclick="chiudiModal()">&times;</button>
            
            <div class="modal-section" id="sec-mezzo">
                <h3>Mezzo</h3>
                <select id="select-mezzo" onchange="aggiornaOpzioniRaggio(); gestisciCascata();">
                    <option value="">-- Seleziona Mezzo --</option>
                    <option value="autobus">Autobus</option>
                    <option value="treno_regionale">Treno Regionale</option>
                    <option value="alta_velocita">Treno ad Alta VelocitÃ </option>
                </select>
            </div>
            
            <div class="modal-section disabled" id="sec-raggio">
                <h3>Raggio</h3>
                <select id="select-raggio" onchange="gestisciCascata()" disabled>
                    <option value="">-- Seleziona Raggio --</option>
                </select>
            </div>
            
            <div class="modal-section disabled" id="sec-notifica">
                <h3>Notifica</h3>
                <select id="select-notifica" onchange="gestisciCascata()" disabled>
                    <option value="">-- Seleziona Sveglia --</option>
                    <option value="suoneria">Suoneria Forte</option>
                    <option value="vibrazione">Solo Vibrazione</option>
                </select>
            </div>
            
            <div class="modal-section section-conferma disabled" id="sec-conferma">
                <button class="btn-conferma" id="btn-conferma-viaggio" onclick="confermaViaggio()" disabled>Conferma Viaggio</button>
            </div>
        </div>
    </div>

    <div class="widget-viaggio" id="widgetViaggio">
        <button class="widget-close" onclick="chiudiWidget()">&times;</button>
        <h2>Il mio viaggio</h2>
        <div class="widget-info" id="widgetDati"></div>
    </div>

    <script>
        let infoWindow; 
        let fermataCorrente = ""; 
        let isLoginMode = true;

        // Esegui all'avvio della pagina
        window.onload = function() {
            // Se l'utente ha giÃ  fatto l'accesso in passato, avvia subito la mappa
            if (localStorage.getItem('token')) {
                document.getElementById('authScreen').style.display = 'none';
                ottieniConfigurazioneEAvviaMappa();
            }
        }

        function cambiaModalitaAuth() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const button = document.getElementById('btnAuthSubmit');
            const toggle = document.getElementById('authToggle');

            if (isLoginMode) {
                title.innerText = "Accedi a NapStop";
                button.innerText = "Accedi";
                toggle.innerHTML = "Non hai un account? <span>Registrati qui</span>";
            } else {
                title.innerText = "Registrati a NapStop";
                button.innerText = "Registrati";
                toggle.innerHTML = "Hai giÃ  un account? <span>Accedi qui</span>";
            }
        }

        function gestisciAutenticazione() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;

            if (!email || !password) {
                alert("Per favore, compila tutti i campi.");
                return;
            }

            const url = isLoginMode ? '/api/login' : '/api/signup';

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => { throw new Error(err.errore) });
                }
                return res.json();
            })
            .then(data => {
                if (isLoginMode) {
                    localStorage.setItem('token', data.token);
                    document.getElementById('authScreen').style.display = 'none';
                    ottieniConfigurazioneEAvviaMappa();
                } else {
                    alert("Registrazione completata! Ora effettua l'accesso.");
                    cambiaModalitaAuth();
                }
            })
            .catch(err => {
                alert("Attenzione: " + err.message);
            });
        }

        function ottieniConfigurazioneEAvviaMappa() {
            fetch('/api-config')
                .then(response => response.json())
                .then(config => {
                    caricaScriptGoogleMaps(config.apiKey);
                })
                .catch(err => {
                    console.error("Errore configurazione API:", err);
                });
        }

        function initMap() {
            const coordinateTrento = { lat: 46.0674, lng: 11.1267 };
            
            const mappa = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: coordinateTrento,
                streetViewControl: false,
                styles: [
                    { featureType: "poi", elementType: "all", stylers: [{ visibility: "off" }] },
                    { featureType: "transit.station", elementType: "all", stylers: [{ visibility: "on" }, { weight: 2 }] },
                    { featureType: "transit.line", elementType: "geometry", stylers: [{ color: "#ffc107" }] }
                ]
            });

            infoWindow = new google.maps.InfoWindow();
            const service = new google.maps.places.PlacesService(mappa);

            mappa.addListener("click", function(e) {
                if (e.placeId) {
                    e.stop();

                    service.getDetails({
                        placeId: e.placeId,
                        fields: ['name']
                    }, function(place, status) {
                        
                        let nomeFermata = "Fermata Selezionata";
                        if (status === google.maps.places.PlacesServiceStatus.OK && place) {
                            nomeFermata = place.name;
                        }

                        const contenutoPopup = `
                            <div class="popup-content">
                                <span class="nome-fermata">${nomeFermata}</span>
                                <button class="btn-prenota" onclick="apriModal('${nomeFermata.replace(/'/g, "\\'")}')">
                                    prenota fermata e inizia il viaggio
                                </button>
                            </div>
                        `;

                        infoWindow.setContent(contenutoPopup);
                        infoWindow.setPosition(e.latLng);
                        infoWindow.open(mappa);
                    });
                }
            });
        }

        function apriModal(nomeFermata) {
            fermataCorrente = nomeFermata; 
            if(infoWindow) infoWindow.close(); 
            
            document.getElementById('select-mezzo').value = "";
            document.getElementById('select-raggio').value = "";
            document.getElementById('select-notifica').value = "";
            aggiornaOpzioniRaggio(); 
            gestisciCascata(); 

            document.getElementById('modalConfigurazione').classList.add('active');
        }

        function chiudiModal() {
            document.getElementById('modalConfigurazione').classList.remove('active');
        }

        function aggiornaOpzioniRaggio() {
            const mezzo = document.getElementById('select-mezzo').value;
            const selectRaggio = document.getElementById('select-raggio');
            
            selectRaggio.innerHTML = '<option value="">-- Seleziona Raggio --</option>';

            if (mezzo === "autobus") {
                selectRaggio.innerHTML += `
                    <option value="350">350 m (circa 1 min.)</option>
                    <option value="1000">1 km (circa 3 min.)</option>
                    <option value="1700">1,7 km (circa 5 min.)</option>
                `;
            } else if (mezzo === "treno_regionale") {
                selectRaggio.innerHTML += `
                    <option value="800">800 m (circa 1 min.)</option>
                    <option value="4500">4,5 km (circa 3 min.)</option>
                    <option value="17000">17 km (circa 10 min.)</option>
                `;
            } else if (mezzo === "alta_velocita") {
                selectRaggio.innerHTML += `
                    <option value="900">900 m (circa 1 min.)</option>
                    <option value="5500">5,5 km (circa 3 min.)</option>
                    <option value="25000">25 km (circa 10 min.)</option>
                `;
            }
        }

        function gestisciCascata() {
            const mezzo = document.getElementById('select-mezzo').value;
            const raggio = document.getElementById('select-raggio').value;
            const notifica = document.getElementById('select-notifica').value;

            const secRaggio = document.getElementById('sec-raggio');
            const secNotifica = document.getElementById('sec-notifica');
            const secConferma = document.getElementById('sec-conferma');

            const selectRaggio = document.getElementById('select-raggio');
            const selectNotifica = document.getElementById('select-notifica');
            const btnConferma = document.getElementById('btn-conferma-viaggio');

            if (mezzo !== "") {
                secRaggio.classList.remove('disabled');
                selectRaggio.removeAttribute('disabled');
            } else {
                secRaggio.classList.add('disabled');
                selectRaggio.setAttribute('disabled', 'true');
                selectRaggio.value = "";
            }

            if (mezzo !== "" && raggio !== "") {
                secNotifica.classList.remove('disabled');
                selectNotifica.removeAttribute('disabled');
            } else {
                secNotifica.classList.add('disabled');
                selectNotifica.setAttribute('disabled', 'true');
                selectNotifica.value = "";
            }

            if (mezzo !== "" && raggio !== "" && notifica !== "") {
                secConferma.classList.remove('disabled');
                btnConferma.removeAttribute('disabled');
            } else {
                secConferma.classList.add('disabled');
                btnConferma.setAttribute('disabled', 'true');
            }
        }

        function confermaViaggio() {
            const selMezzo = document.getElementById('select-mezzo');
            const valoreMezzo = selMezzo.value;
            const testoMezzo = selMezzo.options[selMezzo.selectedIndex].text;

            const selRaggio = document.getElementById('select-raggio');
            const valoreRaggio = selRaggio.value;
            const testoRaggio = selRaggio.options[selRaggio.selectedIndex].text;

            const selNotifica = document.getElementById('select-notifica');
            const valoreNotifica = selNotifica.value;
            const testoNotifica = selNotifica.options[selNotifica.selectedIndex].text;

            const token = localStorage.getItem('token');
            if (!token) {
                alert("Sessione scaduta o non valida. Effettua nuovamente il login.");
                document.getElementById('authScreen').style.display = 'flex';
                return;
            }

            const datiViaggio = {
                destinazione: fermataCorrente,
                mezzo: valoreMezzo,
                raggio: valoreRaggio,
                notifica: valoreNotifica
            };

            fetch('/api/viaggi', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(datiViaggio)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("Errore durante il salvataggio del viaggio.");
                }
                return response.json();
            })
            .then(data => {
                console.log("Successo:", data.messaggio);
                
                const contenutowidget = `
                    <p><strong>Destinazione:</strong><br>${fermataCorrente}</p>
                    <p><strong>Mezzo:</strong> ${testoMezzo}</p>
                    <p><strong>Raggio sveglia:</strong> ${testoRaggio}</p>
                    <p><strong>Tipo notifica:</strong> ${testoNotifica}</p>
                `;
                document.getElementById('widgetDati').innerHTML = contenutowidget;
                document.getElementById('widgetViaggio').classList.add('active');

                chiudiModal();
            })
            .catch(errore => {
                console.error(errore);
                alert("Si Ã¨ verificato un errore nel salvataggio del viaggio nel database.");
            });
        }

        function chiudiWidget() {
            document.getElementById('widgetViaggio').classList.remove('active');
        }

        document.getElementById('modalConfigurazione').addEventListener('click', function(e) {
            if (e.target === this) {
                chiudiModal();
            }
        });

        function caricaScriptGoogleMaps(apiKey) {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
