<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NapStop</title>
    <style>
        /* dimensioni per la mappa */
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
    </style>
</head>
<body>

    <h1>NapStop, implementazione visuale mappa con api google</h1>
    <div id="map">Caricamento mappa in corso...</div>

    <script>
        // Chiediamo la chiave API salvata in .env al nostro server Node.js
        fetch('/api-config')
            .then(response => response.json())
            .then(config => {
                caricaScriptGoogleMaps(config.apiKey);
            });

        // Iniettiamo lo script di Google dinamicamente nella pagina
        function caricaScriptGoogleMaps(apiKey) {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        }

        // Questa funzione viene chiamata automaticamente da Google quando la mappa è pronta
        function initMap() {
            const coordinateTrento = { lat: 46.0674, lng: 11.1267 }; //inizializiamo la mappa con le coordinate di Trento
            
            const mappa = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: coordinateTrento,
            });

            new google.maps.Marker({
                position: coordinateTrento,
                map: mappa,
                title: "Benvenuto a Trento!"
            });
        }
    </script>
</body>
</html>
